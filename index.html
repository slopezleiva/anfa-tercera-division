<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>ANFA · Gestión de Torneo</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img class="brand-mark" src="img/logo-anfa.png" alt="ANFA Tercera División">
      <div class="brand-txt">
        <strong id="torneoNombre">Torneo ANFA</strong>
        <small id="torneoDivision">División</small>
      </div>
    </div>
    <button class="icon-btn" id="btnConfig" title="Configuración">⚙</button>
  </div>
  <div id="barraTorneo" class="torneo-bar" hidden></div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar">
  <a href="#/equipos"      data-tab="equipos"><span>🛡️</span>Equipos</a>
  <a href="#/calendario"   data-tab="calendario"><span>📅</span>Fixture</a>
  <a href="#/convocatoria" data-tab="convocatoria"><span>📋</span>Citación</a>
  <a href="#/partido"      data-tab="partido"><span>⏱️</span>Partido</a>
  <a href="#/incidencias"  data-tab="incidencias"><span>⚖️</span>Incid.</a>
  <a href="#/datos"        data-tab="datos"><span>📊</span>Datos</a>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/views/equipos.js"></script>
<script src="js/views/calendario.js"></script>
<script src="js/views/convocatoria.js"></script>
<script src="js/views/partido.js"></script>
<script src="js/views/incidencias.js"></script>
<script src="js/views/datos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
